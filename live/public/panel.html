<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bảng thử</title>
<style>
  body { font: 16px "Segoe UI", sans-serif; max-width: 420px; margin: 24px auto; padding: 0 16px; background: #10162a; color: #eef3ff; }
  input, button { font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #3a4770; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
  input { background: #0a0f1e; color: inherit; }
  button { background: #24305a; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<h1>Bảng thử</h1>
<p>Gửi một sự kiện giả vào cảnh. Chỉ dùng được ở chế độ giả lập.</p>
<input id="name" value="Khách thử" aria-label="Tên người xem">
<input id="text" value="đêm nay đẹp quá" aria-label="Bình luận">
<button data-kind="join">Vào live</button>
<button data-kind="comment">Bình luận</button>
<button data-kind="like">Thả tim</button>
<button data-kind="follow">Theo dõi</button>
<button data-kind="gift">Tặng quà</button>
<script>
  for (const button of document.querySelectorAll('button')) {
    button.onclick = () => {
      const name = document.getElementById('name').value;
      const text = document.getElementById('text').value;
      fetch('/inject', {
        method: 'POST',
        body: JSON.stringify({ kind: button.dataset.kind, id: `panel-${name}`, name, text, count: 10, diamonds: 30 }),
      });
    };
  }
</script>
</body>
</html>
